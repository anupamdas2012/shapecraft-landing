<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You’re on the list — Shapecraft</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--bg, #0b0c0d); color: var(--text, #edeef0); margin: 0; }
    .thanks { min-height: 100vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 16px; padding: 40px 24px; }
    .thanks .mark { color: var(--accent); font-size: 30px; }
    .thanks h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; margin: 0; }
    .thanks p { color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 30em; margin: 0; }
    .thanks .btn { margin-top: 12px; }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="mark" aria-hidden="true">◆</div>
    <h1>You’re on the <span class="accent">list</span>.</h1>
    <p>Thanks for requesting early access to Shapecraft. We’ll email you at launch — keep an eye on your inbox (and your spam folder, just in case).</p>
    <a class="btn btn-primary" href="/">Back to shapecraft.ai</a>
  </main>
</body>
</html>
